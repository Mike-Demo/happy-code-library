components:
  # The library barrel: typed React wrappers for every Web Awesome element.
  - file: src/index.ts
    operation: ts-named-exports
tokens:
  # Canonical theme entry (CDN imports + brand overrides).
  - file: src/webawesome/theme.css
    operation: css-variables
  # Local snapshot of the token set the theme provides.
  - file: src/webawesome/tokens.css
    operation: css-variables
